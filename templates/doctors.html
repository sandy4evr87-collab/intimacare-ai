<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - IntimaCare AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="page-title">Consult a Sexologist</h1>
    </div>
    
    <div class="doctors-container">
        <div class="search-box">
            <input type="text" placeholder="Search doctor, specialization...">
            <button class="btn btn-primary" style="width: auto; padding: 12px 20px;">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <div class="filter-tabs">
            <button class="filter-tab active">All</button>
            <button class="filter-tab">Online</button>
            <button class="filter-tab">Available Today</button>
        </div>
        
        {% for doctor in doctors %}
        <div class="doctor-card">
            <div class="doctor-header">
                <div class="doctor-avatar">
                    <i class="fas fa-user-doctor"></i>
                </div>
                <div class="doctor-info">
                    <h3>{{ doctor.name }}</h3>
                    <p>{{ doctor.specialization }}</p>
                    <p style="font-size: 12px;">{{ doctor.experience }} Years Experience</p>
                    <div class="doctor-rating">
                        <i class="fas fa-star"></i>
                        {{ doctor.rating }} ({{ doctor.total_ratings }})
                    </div>
                </div>
                <span class="doctor-status {% if doctor.is_online %}status-online{% else %}status-offline{% endif %}">
                    {% if doctor.is_online %}Online{% else %}Offline{% endif %}
                </span>
            </div>
            <a href="{{ url_for('book_appointment', doctor_id=doctor.id) }}" class="book-btn">
                Book Appointment
            </a>
        </div>
        {% endfor %}
        
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button class="btn btn-outline" style="flex: 1;">
                <i class="fas fa-video"></i> Video Call
            </button>
            <button class="btn btn-outline" style="flex: 1;">
                <i class="fas fa-comment"></i> Chat
            </button>
            <button class="btn btn-outline" style="flex: 1;">
                <i class="fas fa-hospital"></i> Clinic Visit
            </button>
        </div>
    </div>
</body>
</html>
